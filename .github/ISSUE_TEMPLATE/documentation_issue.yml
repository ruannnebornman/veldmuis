name: Documentation Issue
description: Report outdated, missing, or unclear documentation.
title: "[Docs]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What documentation needs to change?
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Page or file
      placeholder: "README.md, docs/release.md, SECURITY.md, etc."
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current wording or gap
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected correction
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked that this is still current in the repository source.
          required: false
