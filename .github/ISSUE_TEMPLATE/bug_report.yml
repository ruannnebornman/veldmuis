name: Bug Report
description: Report a Veldmuis bug that is not specific to installation or NVIDIA 580xx.
title: "[Bug]: "
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What failed?
    validations:
      required: true
  - type: dropdown
    id: system-state
    attributes:
      label: Where did this happen?
      options:
        - Live ISO
        - Fresh install
        - Installed system
        - Build or release script
        - Package repository
        - Other
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Veldmuis release tag or ISO name
      placeholder: "2026.06.24 or veldmuis-2026.06.24-network-x86_64.iso"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: List the exact commands or actions that reproduce the issue.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Hardware, VM, boot mode, kernel, package versions, or relevant context.
      placeholder: |
        Hardware or VM:
        Boot mode:
        Kernel:
        Relevant packages:
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or command output
      description: Paste relevant logs. Remove secrets, tokens, and private data.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I checked the support and troubleshooting docs.
          required: true
        - label: I removed secrets, tokens, and private data from this report.
          required: true
