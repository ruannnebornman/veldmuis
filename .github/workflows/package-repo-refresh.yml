name: Package Repo Refresh

on:
  push:
    branches:
      - main
    paths:
      - packages/nvidia-580xx-src/**
      - packages/veldmuis-nvidia-legacy/**
      - packages/veldmuis-muis/**
      - development/build-nvidia-packages.sh
      - development/scan-nvidia-packages.sh
      - development/check-package-repo-refresh.sh
      - development/resolve-muis-release.sh
      - development/publish-r2-package-repo.sh
      - development/muis-keyring/**
  schedule:
    # 12:17 Africa/Johannesburg. GitHub cron uses UTC.
    - cron: "17 10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Build and publish even if source and NVIDIA recipe hashes are current
        required: false
        type: boolean
        default: false
      simulate_build_failure:
        description: Simulate an NVIDIA build failure to test known-good fallback
        required: false
        type: boolean
        default: false
      rebuild_all:
        description: Ignore the package build cache and rebuild every package
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: veldmuis-publication
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh Package Repo
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    outputs:
      scan_risk: ${{ steps.nvidia_scan.outputs.risk }}
      refresh_needed: ${{ steps.refresh_check.outputs.refresh_needed }}
    env:
      BUILDER_USER: builder
      BUILDER_HOME: /home/builder
      GNUPGHOME: /home/builder/.gnupg
      VELDMUIS_KEY_FPR_FILE: /home/builder/current-signing-key.fpr
      CF_R2_ACCOUNT_ID: ${{ vars.CF_R2_ACCOUNT_ID }}
      CF_R2_PACKAGE_BUCKET: ${{ vars.CF_R2_PACKAGE_BUCKET }}
      PACKAGE_BASE_URL: ${{ vars.PACKAGE_BASE_URL }}
      VELDMUIS_PACKAGER: ${{ vars.VELDMUIS_PACKAGER }}
      VELDMUIS_PACKAGE_REFRESH_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && 'true' || 'false' }}
      VELDMUIS_NVIDIA_ENABLE_FALLBACK: true
      VELDMUIS_SIMULATE_BUILD_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_build_failure && 'true' || 'false' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: refs/heads/main

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-repo-hygiene.sh

      - name: Validate protected environment configuration
        shell: bash
        env:
          VELDMUIS_GPG_PRIVATE_KEY: ${{ secrets.VELDMUIS_GPG_PRIVATE_KEY }}
          VELDMUIS_GPG_FPR: ${{ secrets.VELDMUIS_GPG_FPR }}
          CF_R2_PACKAGE_ACCESS_KEY_ID: ${{ secrets.CF_R2_PACKAGE_ACCESS_KEY_ID }}
          CF_R2_PACKAGE_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_PACKAGE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          missing=0

          for secret_name in \
            VELDMUIS_GPG_PRIVATE_KEY \
            VELDMUIS_GPG_FPR \
            CF_R2_PACKAGE_ACCESS_KEY_ID \
            CF_R2_PACKAGE_SECRET_ACCESS_KEY
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required environment secret: ${secret_name}" >&2
              missing=1
            fi
          done

          for var_name in \
            CF_R2_ACCOUNT_ID \
            CF_R2_PACKAGE_BUCKET \
            PACKAGE_BASE_URL
          do
            if [[ -z "${!var_name:-}" ]]; then
              echo "Missing required environment variable: ${var_name}" >&2
              missing=1
            fi
          done

          if [[ -n "${PACKAGE_BASE_URL:-}" && ! "${PACKAGE_BASE_URL}" =~ ^https:// ]]; then
            echo "PACKAGE_BASE_URL must be an HTTPS URL" >&2
            missing=1
          fi

          (( missing == 0 )) || exit 1

      - name: Check whether package refresh is needed
        id: refresh_check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ./development/check-package-repo-refresh.sh

      - name: Stop when package repo is current
        if: steps.refresh_check.outputs.refresh_needed != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "Package repo is current: ${{ steps.refresh_check.outputs.reason }}"

      - name: Compute package build cache key
        id: package_cache
        if: steps.refresh_check.outputs.refresh_needed == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.rebuild_all)
        shell: bash
        run: |
          set -euo pipefail
          key="$(./development/package-build-cache.sh aggregate)"
          echo "key=${key}" >> "${GITHUB_OUTPUT}"

      - name: Restore package build cache
        if: steps.package_cache.outputs.key != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: artifacts/package-build-cache
          key: veldmuis-package-cache-${{ steps.package_cache.outputs.key }}
          restore-keys: |
            veldmuis-package-cache-

      - name: Build and sign package repo in isolated Arch containers
        if: steps.refresh_check.outputs.refresh_needed == 'true'
        shell: bash
        env:
          CI_REPO_ROOT: ${{ github.workspace }}
          VELDMUIS_GPG_PRIVATE_KEY: ${{ secrets.VELDMUIS_GPG_PRIVATE_KEY }}
          VELDMUIS_GPG_FPR: ${{ secrets.VELDMUIS_GPG_FPR }}
          VELDMUIS_PACKAGE_BUILD_CACHE_ENABLE: ${{ (github.event_name == 'workflow_dispatch' && inputs.rebuild_all) && 'false' || 'true' }}
        run: |
          set -euo pipefail
          ./development/run-ci-arch-builder.sh packages

      - name: Install archive inspection tooling
        if: steps.refresh_check.outputs.refresh_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarchive-tools

      - name: Scan built NVIDIA package set
        if: steps.refresh_check.outputs.refresh_needed == 'true'
        id: nvidia_scan
        shell: bash
        env:
          VELDMUIS_NVIDIA_SCAN_REPORT: ${{ runner.temp }}/veldmuis-nvidia-refresh-scan.md
        run: |
          set -euo pipefail
          ./development/build-nvidia-packages.sh --validate-only
          ./development/scan-nvidia-packages.sh \
            --report "${VELDMUIS_NVIDIA_SCAN_REPORT}" \
            --source-root artifacts/nvidia-packages/work

      - name: Preserve candidate scan
        if: steps.nvidia_scan.outputs.risk != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nvidia-refresh-scan-${{ github.run_id }}
          path: ${{ steps.nvidia_scan.outputs.report_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Report unexpected scan findings
        if: steps.nvidia_scan.outputs.risk == 'high'
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Built NVIDIA package set has scan findings outside the reviewed allowlist; review the report before publishing."
          cat "${{ steps.nvidia_scan.outputs.report_file }}"

      - name: Ensure AWS CLI is available
        if: steps.refresh_check.outputs.refresh_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ./development/ensure-aws-cli.sh

      - name: Publish pacman repo to R2
        if: steps.refresh_check.outputs.refresh_needed == 'true'
        shell: bash
        env:
          CF_R2_PACKAGE_ACCESS_KEY_ID: ${{ secrets.CF_R2_PACKAGE_ACCESS_KEY_ID }}
          CF_R2_PACKAGE_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_PACKAGE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ./development/publish-r2-package-repo.sh

      - name: Update known-good NVIDIA package cache
        if: steps.refresh_check.outputs.refresh_needed == 'true'
        shell: bash
        env:
          CF_R2_PACKAGE_ACCESS_KEY_ID: ${{ secrets.CF_R2_PACKAGE_ACCESS_KEY_ID }}
          CF_R2_PACKAGE_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_PACKAGE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ./development/publish-known-good-nvidia-packages.sh --publish-only

      - name: Prune superseded known-good NVIDIA cache objects
        if: steps.refresh_check.outputs.refresh_needed == 'true'
        shell: bash
        env:
          CF_R2_PACKAGE_ACCESS_KEY_ID: ${{ secrets.CF_R2_PACKAGE_ACCESS_KEY_ID }}
          CF_R2_PACKAGE_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_PACKAGE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ./development/publish-known-good-nvidia-packages.sh --prune-only

      - name: Write package refresh summary
        shell: bash
        run: |
          set -euo pipefail

          muis_version="unknown"
          if [[ -r packages/veldmuis-muis/PKGBUILD ]]; then
            muis_version="$(awk -F= '$1 == "pkgver" { print $2; exit }' packages/veldmuis-muis/PKGBUILD)"
          fi

          {
            echo "## Package Repo Refresh Result"
            echo
            echo "- Refresh needed: \`${{ steps.refresh_check.outputs.refresh_needed }}\`"
            echo "- Reason: ${{ steps.refresh_check.outputs.reason }}"
            echo "- Package build cache key: \`${{ steps.package_cache.outputs.key || 'disabled' }}\`"
            echo "- Recipe source: \`local (packages/nvidia-580xx-src)\`"
            echo "- muis version: \`${muis_version}\`"
            echo "- Scan risk: \`${{ steps.nvidia_scan.outputs.risk }}\`"
            echo "- Current source commit: \`${{ steps.refresh_check.outputs.current_source_commit }}\`"
            echo "- Published source commit: \`${{ steps.refresh_check.outputs.published_source_commit || 'unavailable' }}\`"
            echo "- Package repo: ${PACKAGE_BASE_URL}"
            echo "- Package bucket: \`${CF_R2_PACKAGE_BUCKET}\`"
            echo "- Fallback enabled: \`${VELDMUIS_NVIDIA_ENABLE_FALLBACK}\`"
            echo "- Simulated NVIDIA build failure: \`${VELDMUIS_SIMULATE_BUILD_FAILURE}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

