name: Release

on:
  schedule:
    # 20:00 Africa/Johannesburg on the 1st of each month.
    - cron: "0 18 1 * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Daily release tag in YYYY.MM.DD or YYYY.MM.DD.N format
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Release Ref
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_ref: ${{ steps.resolve.outputs.release_ref }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Check release policy
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-release-policy.sh

      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main'
          monthly_tag_pattern='^[0-9]{4}\.(0[1-9]|1[0-2])$'
          daily_tag_pattern='^([0-9]{4})\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.([2-9]|[1-9][0-9]+))?$'

          is_valid_monthly_tag() {
            local tag="$1"
            local normalized=""

            [[ "${tag}" =~ ${monthly_tag_pattern} ]] || return 1
            normalized="$(date -u -d "${tag//./-}-01" +%Y.%m 2>/dev/null)" || return 1
            [[ "${normalized}" == "${tag}" ]]
          }

          is_valid_daily_tag() {
            local tag="$1"
            local date_part=""
            local normalized=""

            [[ "${tag}" =~ ${daily_tag_pattern} ]] || return 1
            date_part="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            normalized="$(date -u -d "${date_part//./-}" +%Y.%m.%d 2>/dev/null)" || return 1
            [[ "${normalized}" == "${date_part}" ]]
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            release_date=""
            expected_tag=""
            max_sequence=0
            release_tag="${{ inputs.release_tag }}"
            is_valid_daily_tag "${release_tag}" || {
              echo "Manual release tags must use YYYY.MM.DD or YYYY.MM.DD.N with N >= 2, got: ${release_tag}" >&2
              exit 1
            }
            [[ "${release_tag}" =~ ${daily_tag_pattern} ]]
            release_date="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"

            while IFS= read -r existing_tag; do
              if [[ "${existing_tag}" == "${release_date}" ]]; then
                max_sequence=1
              elif [[ "${existing_tag}" =~ ^${release_date//./\\.}\.([0-9]+)$ ]]; then
                ((BASH_REMATCH[1] > max_sequence)) && max_sequence="${BASH_REMATCH[1]}"
              fi
            done < <(git tag)

            if ((max_sequence == 0)); then
              expected_tag="${release_date}"
            else
              expected_tag="${release_date}.$((max_sequence + 1))"
            fi

            [[ "${release_tag}" == "${expected_tag}" ]] || {
              echo "Next release tag for ${release_date} must be ${expected_tag}, got: ${release_tag}" >&2
              exit 1
            }
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            release_tag="$(date -u +%Y.%m)"
            is_valid_monthly_tag "${release_tag}" || {
              echo "Scheduled release tag must use YYYY.MM, got: ${release_tag}" >&2
              exit 1
            }
          else
            echo "Unsupported release event: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

          while IFS= read -r existing_tag; do
            is_valid_monthly_tag "${existing_tag}" || is_valid_daily_tag "${existing_tag}" || {
              echo "Unsupported repository tag found: ${existing_tag}" >&2
              exit 1
            }
          done < <(git tag)

          release_ref="refs/tags/${release_tag}"
          if git rev-parse --verify "${release_ref}" >/dev/null 2>&1; then
            echo "Release tag already exists and cannot be reused: ${release_tag}" >&2
            exit 1
          fi
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "GitHub release already exists and cannot be reused: ${release_tag}" >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${release_tag}" origin/main -m "Release ${release_tag}"
          git push origin "refs/tags/${release_tag}"
          git fetch --force --tags origin

          git rev-parse --verify "${release_ref}" >/dev/null 2>&1 || {
            echo "Release tag was not created: ${release_tag}" >&2
            exit 1
          }

          release_sha="$(git rev-list -n 1 "${release_ref}")"

          {
            echo "release_tag=${release_tag}"
            echo "release_ref=${release_ref}"
            echo "release_sha=${release_sha}"
          } >> "${GITHUB_OUTPUT}"

  build-and-publish:
    name: Build And Release
    needs: validate-release
    runs-on: ubuntu-latest
    environment: release
    env:
      BUILDER_USER: builder
      BUILDER_HOME: /home/builder
      GNUPGHOME: /home/builder/.gnupg
      VELDMUIS_KEY_FPR_FILE: /home/builder/current-signing-key.fpr
      RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
      CF_R2_ACCOUNT_ID: ${{ vars.CF_R2_ACCOUNT_ID }}
      CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
      CF_R2_PREFIX: ${{ vars.CF_R2_PREFIX }}
      CF_R2_PUBLIC_BASE_URL: ${{ vars.CF_R2_PUBLIC_BASE_URL }}
      CF_R2_PACKAGE_BUCKET: ${{ vars.CF_R2_PACKAGE_BUCKET }}
      PACKAGE_BASE_URL: ${{ vars.PACKAGE_BASE_URL }}
      VELDMUIS_PACKAGER: ${{ vars.VELDMUIS_PACKAGER }}
      VELDMUIS_AUR_REF_MODE: latest
      VELDMUIS_AUR_ENABLE_FALLBACK: true
    steps:
      - name: Check out release ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.validate-release.outputs.release_ref }}

      - name: Check out workflow support scripts
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.sha }}
          path: .ci-support

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          ./.ci-support/development/check-repo-hygiene.sh

      - name: Validate protected environment configuration
        shell: bash
        env:
          VELDMUIS_GPG_PRIVATE_KEY: ${{ secrets.VELDMUIS_GPG_PRIVATE_KEY }}
          VELDMUIS_GPG_FPR: ${{ secrets.VELDMUIS_GPG_FPR }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          CF_R2_PACKAGE_ACCESS_KEY_ID: ${{ secrets.CF_R2_PACKAGE_ACCESS_KEY_ID }}
          CF_R2_PACKAGE_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_PACKAGE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          missing=0

          for secret_name in \
            VELDMUIS_GPG_PRIVATE_KEY \
            VELDMUIS_GPG_FPR \
            CF_R2_ACCESS_KEY_ID \
            CF_R2_SECRET_ACCESS_KEY \
            CF_R2_PACKAGE_ACCESS_KEY_ID \
            CF_R2_PACKAGE_SECRET_ACCESS_KEY
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required environment secret: ${secret_name}" >&2
              missing=1
            fi
          done

          for var_name in \
            CF_R2_ACCOUNT_ID \
            CF_R2_BUCKET \
            CF_R2_PACKAGE_BUCKET \
            CF_R2_PUBLIC_BASE_URL \
            PACKAGE_BASE_URL
          do
            if [[ -z "${!var_name:-}" ]]; then
              echo "Missing required environment variable: ${var_name}" >&2
              missing=1
            fi
          done

          if [[ -n "${PACKAGE_BASE_URL:-}" && ! "${PACKAGE_BASE_URL}" =~ ^https:// ]]; then
            echo "PACKAGE_BASE_URL must be an HTTPS URL" >&2
            missing=1
          fi
          if [[ -n "${CF_R2_PUBLIC_BASE_URL:-}" && ! "${CF_R2_PUBLIC_BASE_URL}" =~ ^https:// ]]; then
            echo "CF_R2_PUBLIC_BASE_URL must be an HTTPS URL" >&2
            missing=1
          fi

          (( missing == 0 )) || exit 1

      - name: Build packages, repo, and ISO in Arch container
        shell: bash
        env:
          CI_REPO_ROOT: ${{ github.workspace }}
          VELDMUIS_RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          VELDMUIS_GPG_PRIVATE_KEY: ${{ secrets.VELDMUIS_GPG_PRIVATE_KEY }}
          VELDMUIS_GPG_FPR: ${{ secrets.VELDMUIS_GPG_FPR }}
        run: |
          set -euo pipefail
          ./.ci-support/development/run-ci-arch-builder.sh iso

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          set -euo pipefail
          ./.ci-support/development/ensure-aws-cli.sh

      - name: Publish pacman repo to R2
        shell: bash
        env:
          CF_R2_PACKAGE_ACCESS_KEY_ID: ${{ secrets.CF_R2_PACKAGE_ACCESS_KEY_ID }}
          CF_R2_PACKAGE_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_PACKAGE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ./development/publish-r2-package-repo.sh

      - name: Update known-good NVIDIA package cache
        shell: bash
        env:
          CF_R2_PACKAGE_ACCESS_KEY_ID: ${{ secrets.CF_R2_PACKAGE_ACCESS_KEY_ID }}
          CF_R2_PACKAGE_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_PACKAGE_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          ./development/publish-known-good-nvidia-packages.sh

      - name: Generate checksums and manifest
        id: metadata
        shell: bash
        env:
          VELDMUIS_GPG_FPR: ${{ secrets.VELDMUIS_GPG_FPR }}
        run: |
          set -euo pipefail

          output_root="${RUNNER_TEMP}/veldmuis-build/archiso/out"
          iso_path="$(find "${output_root}" -maxdepth 1 -type f -name 'veldmuis-*.iso' -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          [[ -n "${iso_path}" ]] || {
            echo "No ISO found under ${output_root}" >&2
            exit 1
          }

          iso_name="$(basename "${iso_path}")"
          expected_iso_name="veldmuis-${RELEASE_TAG}-x86_64.iso"
          [[ "${iso_name}" == "${expected_iso_name}" ]] || {
            echo "Built ISO name does not match release tag: expected ${expected_iso_name}, got ${iso_name}" >&2
            exit 1
          }
          sha256="$(sha256sum "${iso_path}" | awk '{print $1}')"
          sha_path="${iso_path}.sha256"
          printf '%s  %s\n' "${sha256}" "${iso_name}" > "${sha_path}"

          manifest_name="${iso_name%.iso}.manifest.txt"
          manifest_path="${output_root}/${manifest_name}"
          download_iso_name="${iso_name}"
          download_sha_name="${download_iso_name}.sha256"
          download_manifest_name="${manifest_name}"
          short_sha="${RELEASE_SHA:0:8}"
          {
            echo "release_tag=${RELEASE_TAG}"
            echo "release_sha=${RELEASE_SHA}"
            echo "iso_name=${iso_name}"
            echo "sha256=${sha256}"
            echo "signing_fingerprint=${VELDMUIS_GPG_FPR}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${manifest_path}"

          r2_prefix="${CF_R2_PREFIX:-iso}"
          r2_prefix="${r2_prefix#/}"
          r2_prefix="${r2_prefix%/}"
          [[ -n "${r2_prefix}" ]] || {
            echo "CF_R2_PREFIX resolves to an empty path" >&2
            exit 1
          }

          iso_object_key="${r2_prefix}/latest.iso"
          sha_object_key="${r2_prefix}/latest.iso.sha256"
          manifest_object_key="${r2_prefix}/latest.manifest.txt"

          {
            echo "iso_path=${iso_path}"
            echo "sha_path=${sha_path}"
            echo "manifest_path=${manifest_path}"
            echo "iso_name=${iso_name}"
            echo "manifest_name=${manifest_name}"
            echo "download_iso_name=${download_iso_name}"
            echo "download_sha_name=${download_sha_name}"
            echo "download_manifest_name=${download_manifest_name}"
            echo "sha256=${sha256}"
            echo "artifact_name=veldmuis-iso-${RELEASE_TAG}-${short_sha}"
            echo "iso_object_key=${iso_object_key}"
            echo "sha_object_key=${sha_object_key}"
            echo "manifest_object_key=${manifest_object_key}"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.metadata.outputs.iso_path }}
            ${{ steps.metadata.outputs.sha_path }}
            ${{ steps.metadata.outputs.manifest_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload release artifacts to R2
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail

          endpoint="https://${CF_R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          bucket="${CF_R2_BUCKET}"
          prefix="${CF_R2_PREFIX:-iso}"
          prefix="${prefix#/}"
          prefix="${prefix%/}"
          [[ -n "${prefix}" ]] || {
            echo "CF_R2_PREFIX resolves to an empty path" >&2
            exit 1
          }

          aws s3 rm "s3://${bucket}/${prefix}" \
            --recursive \
            --endpoint-url "${endpoint}" \
            --only-show-errors

          aws s3 cp "${{ steps.metadata.outputs.iso_path }}" \
            "s3://${bucket}/${{ steps.metadata.outputs.iso_object_key }}" \
            --endpoint-url "${endpoint}" \
            --only-show-errors \
            --content-disposition "attachment; filename=\"${{ steps.metadata.outputs.download_iso_name }}\"" \
            --content-type application/octet-stream

          aws s3 cp "${{ steps.metadata.outputs.sha_path }}" \
            "s3://${bucket}/${{ steps.metadata.outputs.sha_object_key }}" \
            --endpoint-url "${endpoint}" \
            --only-show-errors \
            --content-disposition "attachment; filename=\"${{ steps.metadata.outputs.download_sha_name }}\"" \
            --content-type text/plain

          aws s3 cp "${{ steps.metadata.outputs.manifest_path }}" \
            "s3://${bucket}/${{ steps.metadata.outputs.manifest_object_key }}" \
            --endpoint-url "${endpoint}" \
            --only-show-errors \
            --content-disposition "attachment; filename=\"${{ steps.metadata.outputs.download_manifest_name }}\"" \
            --content-type text/plain

      - name: Ensure GitHub CLI is available
        shell: bash
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Create or update GitHub release
        id: github_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_ASSET_PATH: ${{ steps.metadata.outputs.sha_path }}
          MANIFEST_ASSET_PATH: ${{ steps.metadata.outputs.manifest_path }}
        run: |
          set -euo pipefail

          note_file="development/release-notes/${RELEASE_TAG}.md"
          body_file="${RUNNER_TEMP}/release-${RELEASE_TAG}.md"
          monthly_pattern='^[0-9]{4}\.(0[1-9]|1[0-2])$'
          release_tag_pattern='^[0-9]{4}\.(0[1-9]|1[0-2])(\.(0[1-9]|[12][0-9]|3[01])(\.([2-9]|[1-9][0-9]+))?)?$'

          previous_release_tag="$(
            git tag --merged "${RELEASE_SHA}" --sort=-creatordate \
              | grep -E "${release_tag_pattern}" \
              | grep -Fxv "${RELEASE_TAG}" \
              | head -n 1 || true
          )"
          previous_monthly_tag="$(
            git tag --merged "${RELEASE_SHA}" --sort=-creatordate \
              | grep -E "${monthly_pattern}" \
              | grep -Fxv "${RELEASE_TAG}" \
              | head -n 1 || true
          )"

          collect_release_changes() {
            local range_start="$1"
            local -a log_args=()

            if [[ -n "${range_start}" ]]; then
              log_args=("${range_start}..${RELEASE_SHA}")
            else
              log_args=("-n" "15" "${RELEASE_SHA}")
            fi

            git log --no-merges --format='- %s (%h)' "${log_args[@]}"
          }

          if [[ -f "${note_file}" ]]; then
            cat "${note_file}" > "${body_file}"
            {
              echo
              echo '## Complete Commit List'
              echo
            } >> "${body_file}"

            if ! collect_release_changes "${previous_release_tag}" >> "${body_file}"; then
              echo '- Release change summary could not be generated automatically.' >> "${body_file}"
            fi
          else
            compare_base="${previous_release_tag}"
            compare_label='Changes'

            if [[ "${RELEASE_TAG}" =~ ${monthly_pattern} ]]; then
              compare_base="${previous_monthly_tag}"
              compare_label='Changes Since Last Monthly Release'
            fi

            if [[ "${RELEASE_TAG}" =~ ${monthly_pattern} ]]; then
              lead_line='- Monthly release.'
            else
              lead_line='- Manual dated release.'
            fi

            {
              echo '# Highlights'
              echo
              echo "${lead_line}"
              if [[ -n "${compare_base}" ]]; then
                echo "- Changes since \`${compare_base}\`."
              else
                if [[ "${RELEASE_TAG}" =~ ${monthly_pattern} ]]; then
                  echo '- No earlier monthly Veldmuis release tag was found for comparison.'
                else
                  echo '- No earlier Veldmuis release tag was found for comparison.'
                fi
              fi
              echo
              echo "## ${compare_label}"
              echo
            } > "${body_file}"

            if ! collect_release_changes "${compare_base}" >> "${body_file}"; then
              echo '- Release change summary could not be generated automatically.' >> "${body_file}"
            fi
          fi

          {
            echo
            echo "## Release Metadata"
            echo
            echo "Veldmuis retains only the current ISO; release-specific ISO downloads are not archived."
            echo "Checksum asset: \`$(basename "${SHA_ASSET_PATH}")\`"
            echo "Manifest asset: \`$(basename "${MANIFEST_ASSET_PATH}")\`"
            echo "SHA256: \`$(cat "${SHA_ASSET_PATH}")\`"
            echo
            echo "## Build Metadata"
            echo
            echo "- ISO file: \`${{ steps.metadata.outputs.iso_name }}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Package repo: ${PACKAGE_BASE_URL}"
          } >> "${body_file}"

          if [[ "${RELEASE_TAG}" =~ ${monthly_pattern} ]]; then
            release_title="Veldmuis Linux ${RELEASE_TAG}"
          else
            release_title="Veldmuis ${RELEASE_TAG}"
          fi

          gh release create "${RELEASE_TAG}" \
            --title "${release_title}" \
            --notes-file "${body_file}" \
            --verify-tag

          gh release upload "${RELEASE_TAG}" \
            "${SHA_ASSET_PATH}" \
            "${MANIFEST_ASSET_PATH}"

          echo "html_url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify published release policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          public_base="$(printf '%s' "${CF_R2_PUBLIC_BASE_URL:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${public_base}" =~ ^https:// ]] || {
            echo "CF_R2_PUBLIC_BASE_URL must be an HTTPS URL" >&2
            exit 1
          }

          VELDMUIS_LATEST_ISO_URL="${public_base%/}/latest.iso" \
            ./development/check-release-policy.sh --remote

      - name: Write release summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Release"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- ISO: \`${{ steps.metadata.outputs.iso_name }}\`"
            echo "- SHA256: \`${{ steps.metadata.outputs.sha256 }}\`"
            echo "- Bucket: \`${CF_R2_BUCKET}\`"
            echo "- Package bucket: \`${CF_R2_PACKAGE_BUCKET}\`"
            echo "- Published ISO key: \`${{ steps.metadata.outputs.iso_object_key }}\`"
            echo "- Published SHA256 key: \`${{ steps.metadata.outputs.sha_object_key }}\`"
            echo "- Published manifest key: \`${{ steps.metadata.outputs.manifest_object_key }}\`"
            echo "- GitHub Release: ${{ steps.github_release.outputs.html_url }}"
            echo "- Package repo: ${PACKAGE_BASE_URL}"

            public_base="$(printf '%s' "${CF_R2_PUBLIC_BASE_URL:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ "${public_base}" =~ ^https?:// ]]; then
              public_base="${public_base%/}"
              echo "- Public ISO URL: ${public_base}/latest.iso"
              echo "- Public SHA256 URL: ${public_base}/latest.iso.sha256"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
