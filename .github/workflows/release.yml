name: Network Installer Release

on:
  schedule:
    # 20:00 Africa/Johannesburg on the 1st of each month.
    - cron: "0 18 1 * *"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Daily release tag in YYYY.MM.DD or YYYY.MM.DD.N format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: veldmuis-publication
  cancel-in-progress: false

jobs:
  validate-release:
    name: Validate Network Release Ref
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      release_sha: ${{ steps.resolve.outputs.release_sha }}
    steps:
      - name: Check out repository metadata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/heads/main

      - name: Check release policy
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-release-policy.sh

      - name: Resolve release tag
        id: resolve
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git fetch --force --tags origin '+refs/heads/main:refs/remotes/origin/main'
          monthly_tag_pattern='^[0-9]{4}\.(0[1-9]|1[0-2])$'
          daily_tag_pattern='^([0-9]{4})\.(0[1-9]|1[0-2])\.(0[1-9]|[12][0-9]|3[01])(\.([2-9]|[1-9][0-9]+))?$'

          is_valid_monthly_tag() {
            local tag="$1"
            local normalized=""

            [[ "${tag}" =~ ${monthly_tag_pattern} ]] || return 1
            normalized="$(date -u -d "${tag//./-}-01" +%Y.%m 2>/dev/null)" || return 1
            [[ "${normalized}" == "${tag}" ]]
          }

          is_valid_daily_tag() {
            local tag="$1"
            local date_part=""
            local normalized=""

            [[ "${tag}" =~ ${daily_tag_pattern} ]] || return 1
            date_part="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"
            normalized="$(date -u -d "${date_part//./-}" +%Y.%m.%d 2>/dev/null)" || return 1
            [[ "${normalized}" == "${date_part}" ]]
          }

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] || {
              echo "Manual releases must be dispatched from main, got: ${GITHUB_REF}" >&2
              exit 1
            }
            release_date=""
            expected_tag=""
            max_sequence=0
            release_tag="${{ inputs.release_tag }}"
            is_valid_daily_tag "${release_tag}" || {
              echo "Manual release tags must use YYYY.MM.DD or YYYY.MM.DD.N with N >= 2, got: ${release_tag}" >&2
              exit 1
            }
            [[ "${release_tag}" =~ ${daily_tag_pattern} ]]
            release_date="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}"

            while IFS= read -r existing_tag; do
              if [[ "${existing_tag}" == "${release_date}" ]]; then
                max_sequence=1
              elif [[ "${existing_tag}" =~ ^${release_date//./\\.}\.([0-9]+)$ ]]; then
                ((BASH_REMATCH[1] > max_sequence)) && max_sequence="${BASH_REMATCH[1]}"
              fi
            done < <(git tag)

            if ((max_sequence == 0)); then
              expected_tag="${release_date}"
            else
              expected_tag="${release_date}.$((max_sequence + 1))"
            fi

            [[ "${release_tag}" == "${expected_tag}" ]] || {
              echo "Next release tag for ${release_date} must be ${expected_tag}, got: ${release_tag}" >&2
              exit 1
            }
          elif [[ "${GITHUB_EVENT_NAME}" == "schedule" ]]; then
            release_tag="$(date -u +%Y.%m)"
            is_valid_monthly_tag "${release_tag}" || {
              echo "Scheduled release tag must use YYYY.MM, got: ${release_tag}" >&2
              exit 1
            }
          else
            echo "Unsupported release event: ${GITHUB_EVENT_NAME}" >&2
            exit 1
          fi

          while IFS= read -r existing_tag; do
            is_valid_monthly_tag "${existing_tag}" || is_valid_daily_tag "${existing_tag}" || {
              echo "Unsupported repository tag found: ${existing_tag}" >&2
              exit 1
            }
          done < <(git tag)

          if git rev-parse --verify "refs/tags/${release_tag}" >/dev/null 2>&1; then
            echo "Release tag already exists and cannot be reused: ${release_tag}" >&2
            exit 1
          fi
          if gh release view "${release_tag}" >/dev/null 2>&1; then
            echo "GitHub release already exists and cannot be reused: ${release_tag}" >&2
            exit 1
          fi

          release_sha="$(git rev-parse origin/main)"
          [[ "${release_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Unable to resolve the main release commit" >&2
            exit 1
          }

          {
            echo "release_tag=${release_tag}"
            echo "release_sha=${release_sha}"
          } >> "${GITHUB_OUTPUT}"

  build-and-publish:
    name: Build And Publish Network Installer
    needs: validate-release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    env:
      BUILDER_USER: builder
      BUILDER_HOME: /home/builder
      GNUPGHOME: /home/builder/.gnupg
      VELDMUIS_KEY_FPR_FILE: /home/builder/current-signing-key.fpr
      RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
      CF_R2_ACCOUNT_ID: ${{ vars.CF_R2_ACCOUNT_ID }}
      CF_R2_BUCKET: ${{ vars.CF_R2_BUCKET }}
      CF_R2_PREFIX: ${{ vars.CF_R2_PREFIX }}
      CF_R2_PUBLIC_BASE_URL: ${{ vars.CF_R2_PUBLIC_BASE_URL }}
      PACKAGE_BASE_URL: ${{ vars.PACKAGE_BASE_URL }}
      VELDMUIS_PACKAGER: ${{ vars.VELDMUIS_PACKAGER }}
      VELDMUIS_AUR_REF_MODE: latest
      VELDMUIS_AUR_ENABLE_FALLBACK: true
    steps:
      - name: Check out release ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.validate-release.outputs.release_sha }}

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-repo-hygiene.sh

      - name: Validate protected environment configuration
        shell: bash
        env:
          VELDMUIS_GPG_PRIVATE_KEY: ${{ secrets.VELDMUIS_GPG_PRIVATE_KEY }}
          VELDMUIS_GPG_FPR: ${{ secrets.VELDMUIS_GPG_FPR }}
          CF_R2_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          CF_R2_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail

          missing=0

          for secret_name in \
            VELDMUIS_GPG_PRIVATE_KEY \
            VELDMUIS_GPG_FPR \
            CF_R2_ACCESS_KEY_ID \
            CF_R2_SECRET_ACCESS_KEY
          do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing required environment secret: ${secret_name}" >&2
              missing=1
            fi
          done

          for var_name in \
            CF_R2_ACCOUNT_ID \
            CF_R2_BUCKET \
            CF_R2_PUBLIC_BASE_URL \
            PACKAGE_BASE_URL
          do
            if [[ -z "${!var_name:-}" ]]; then
              echo "Missing required environment variable: ${var_name}" >&2
              missing=1
            fi
          done

          if [[ -n "${PACKAGE_BASE_URL:-}" && ! "${PACKAGE_BASE_URL}" =~ ^https:// ]]; then
            echo "PACKAGE_BASE_URL must be an HTTPS URL" >&2
            missing=1
          fi
          if [[ -n "${CF_R2_PUBLIC_BASE_URL:-}" && ! "${CF_R2_PUBLIC_BASE_URL}" =~ ^https:// ]]; then
            echo "CF_R2_PUBLIC_BASE_URL must be an HTTPS URL" >&2
            missing=1
          fi

          (( missing == 0 )) || exit 1

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail

          sudo rm -rf \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/share/dotnet
          docker system prune --all --force --volumes
          df -h /

      - name: Build packages, repo, and ISO in isolated Arch containers
        shell: bash
        env:
          CI_REPO_ROOT: ${{ github.workspace }}
          VELDMUIS_RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          VELDMUIS_RELEASE_SHA: ${{ needs.validate-release.outputs.release_sha }}
          VELDMUIS_ISO_MODE: network
          VELDMUIS_GPG_PRIVATE_KEY: ${{ secrets.VELDMUIS_GPG_PRIVATE_KEY }}
          VELDMUIS_GPG_FPR: ${{ secrets.VELDMUIS_GPG_FPR }}
        run: |
          set -euo pipefail
          ./development/run-ci-arch-builder.sh iso

      - name: Create immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          [[ "$(git rev-parse HEAD)" == "${RELEASE_SHA}" ]] || {
            echo "Checked-out source does not match the resolved release commit" >&2
            exit 1
          }
          git fetch --force --tags origin
          if git rev-parse --verify "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release tag appeared during the build and cannot be reused: ${RELEASE_TAG}" >&2
            exit 1
          fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release appeared during the build and cannot be reused: ${RELEASE_TAG}" >&2
            exit 1
          fi

          tag_object_sha="$(
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${RELEASE_TAG}" \
              -f message="Release ${RELEASE_TAG}" \
              -f object="${RELEASE_SHA}" \
              -f type=commit \
              --jq '.sha'
          )"
          [[ "${tag_object_sha}" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Release tag object was not created" >&2
            exit 1
          }
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${RELEASE_TAG}" \
            -f sha="${tag_object_sha}" >/dev/null

          git fetch --force --tags origin
          [[ "$(git rev-list -n 1 "refs/tags/${RELEASE_TAG}")" == "${RELEASE_SHA}" ]] || {
            echo "Created release tag does not resolve to the release commit" >&2
            exit 1
          }

      - name: Ensure AWS CLI is available
        shell: bash
        run: |
          set -euo pipefail
          ./development/ensure-aws-cli.sh

      - name: Validate signed release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          output_root="${RUNNER_TEMP}/veldmuis-build/archiso/out"
          artifact_stem="veldmuis-${RELEASE_TAG}-network-x86_64"
          iso_name="${artifact_stem}.iso"
          manifest_name="${artifact_stem}.manifest.txt"
          iso_path="${output_root}/${iso_name}"
          sha_path="${iso_path}.sha256"
          manifest_path="${output_root}/${manifest_name}"
          signature_path="${manifest_path}.sig"
          package_inventory_path="${output_root}/${artifact_stem}.packages.tsv"
          sbom_path="${output_root}/${artifact_stem}.spdx"
          build_inputs_path="${output_root}/${artifact_stem}.build-inputs.txt"
          aur_manifest_path="${output_root}/${artifact_stem}.aur-packages.manifest.txt"

          for artifact_path in \
            "${iso_path}" \
            "${sha_path}" \
            "${manifest_path}" \
            "${signature_path}" \
            "${package_inventory_path}" \
            "${sbom_path}" \
            "${build_inputs_path}" \
            "${aur_manifest_path}"
          do
            [[ -s "${artifact_path}" ]] || {
              echo "Release artifact is missing or empty: ${artifact_path}" >&2
              exit 1
            }
          done

          manifest_value() {
            local key="$1"
            awk -F= -v wanted="${key}" '$1 == wanted { print substr($0, index($0, "=") + 1); exit }' "${manifest_path}"
          }
          verify_manifest_hash() {
            local key="$1"
            local path="$2"
            local expected=""
            local actual=""
            expected="$(manifest_value "${key}")"
            actual="$(sha256sum "${path}" | awk '{ print $1 }')"
            [[ "${actual}" == "${expected}" ]] || {
              echo "Manifest hash mismatch for ${path}" >&2
              exit 1
            }
          }

          [[ "$(manifest_value release_tag)" == "${RELEASE_TAG}" ]] || {
            echo "Manifest release tag does not match ${RELEASE_TAG}" >&2
            exit 1
          }
          [[ "$(manifest_value release_sha)" == "${RELEASE_SHA}" ]] || {
            echo "Manifest release commit does not match ${RELEASE_SHA}" >&2
            exit 1
          }
          [[ "$(manifest_value installer)" == "network" ]] || {
            echo "Manifest installer does not identify the network image" >&2
            exit 1
          }
          [[ "$(manifest_value iso_name)" == "${iso_name}" ]] || {
            echo "Manifest ISO name does not match ${iso_name}" >&2
            exit 1
          }
          sha256="$(sha256sum "${iso_path}" | awk '{ print $1 }')"
          [[ "$(manifest_value sha256)" == "${sha256}" ]] || {
            echo "Manifest ISO checksum does not match the built ISO" >&2
            exit 1
          }
          [[ "$(awk '{ print $1; exit }' "${sha_path}")" == "${sha256}" ]] || {
            echo "Checksum file does not match the built ISO" >&2
            exit 1
          }
          verify_manifest_hash package_inventory_sha256 "${package_inventory_path}"
          verify_manifest_hash sbom_sha256 "${sbom_path}"
          verify_manifest_hash build_inputs_sha256 "${build_inputs_path}"
          verify_manifest_hash aur_manifest_sha256 "${aur_manifest_path}"
          gpgv --keyring ./packages/veldmuis-keyring/veldmuis.gpg \
            "${signature_path}" "${manifest_path}"

          short_sha="${RELEASE_SHA:0:8}"
          r2_prefix="${CF_R2_PREFIX:-iso}"
          r2_prefix="${r2_prefix#/}"
          r2_prefix="${r2_prefix%/}"
          [[ -n "${r2_prefix}" ]] || {
            echo "CF_R2_PREFIX resolves to an empty path" >&2
            exit 1
          }

          public_base="${CF_R2_PUBLIC_BASE_URL%/}"
          immutable_base="${public_base}/releases/${RELEASE_TAG}"

          {
            echo "output_root=${output_root}"
            echo "iso_path=${iso_path}"
            echo "sha_path=${sha_path}"
            echo "manifest_path=${manifest_path}"
            echo "signature_path=${signature_path}"
            echo "package_inventory_path=${package_inventory_path}"
            echo "sbom_path=${sbom_path}"
            echo "build_inputs_path=${build_inputs_path}"
            echo "aur_manifest_path=${aur_manifest_path}"
            echo "iso_name=${iso_name}"
            echo "manifest_name=${manifest_name}"
            echo "signature_name=$(basename "${signature_path}")"
            echo "package_inventory_name=$(basename "${package_inventory_path}")"
            echo "sbom_name=$(basename "${sbom_path}")"
            echo "build_inputs_name=$(basename "${build_inputs_path}")"
            echo "aur_manifest_name=$(basename "${aur_manifest_path}")"
            echo "sha256=${sha256}"
            echo "artifact_name=veldmuis-iso-${RELEASE_TAG}-${short_sha}"
            echo "release_object_prefix=${r2_prefix}/releases/${RELEASE_TAG}"
            echo "channel_object_key=${r2_prefix}/channels/network.json"
            echo "immutable_iso_url=${immutable_base}/${iso_name}"
            echo "immutable_manifest_url=${immutable_base}/${manifest_name}"
            echo "immutable_signature_url=${immutable_base}/$(basename "${signature_path}")"
          } >> "${GITHUB_OUTPUT}"

      - name: Upload debug artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: |
            ${{ steps.metadata.outputs.iso_path }}
            ${{ steps.metadata.outputs.sha_path }}
            ${{ steps.metadata.outputs.manifest_path }}
            ${{ steps.metadata.outputs.signature_path }}
            ${{ steps.metadata.outputs.package_inventory_path }}
            ${{ steps.metadata.outputs.sbom_path }}
            ${{ steps.metadata.outputs.build_inputs_path }}
            ${{ steps.metadata.outputs.aur_manifest_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Configure release-channel browser access
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          ./development/configure-r2-release-cors.sh

      - name: Publish immutable network installer
        shell: bash
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          VELDMUIS_RELEASE_OUTPUT_DIR: ${{ steps.metadata.outputs.output_root }}
          VELDMUIS_RELEASE_TAG: ${{ needs.validate-release.outputs.release_tag }}
          VELDMUIS_ISO_MODE: network
          R2_RELEASE_REMOVE_LEGACY_ALIASES: "1"
        run: |
          set -euo pipefail
          ./development/publish-r2-release.sh

      - name: Ensure GitHub CLI is available
        shell: bash
        run: |
          set -euo pipefail

          if command -v gh >/dev/null 2>&1; then
            gh --version
            exit 0
          fi

          sudo apt-get update
          sudo apt-get install -y gh
          gh --version

      - name: Create GitHub release
        id: github_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA_ASSET_PATH: ${{ steps.metadata.outputs.sha_path }}
          MANIFEST_ASSET_PATH: ${{ steps.metadata.outputs.manifest_path }}
          SIGNATURE_ASSET_PATH: ${{ steps.metadata.outputs.signature_path }}
          PACKAGE_INVENTORY_ASSET_PATH: ${{ steps.metadata.outputs.package_inventory_path }}
          SBOM_ASSET_PATH: ${{ steps.metadata.outputs.sbom_path }}
          BUILD_INPUTS_ASSET_PATH: ${{ steps.metadata.outputs.build_inputs_path }}
          AUR_MANIFEST_ASSET_PATH: ${{ steps.metadata.outputs.aur_manifest_path }}
          IMMUTABLE_ISO_URL: ${{ steps.metadata.outputs.immutable_iso_url }}
          IMMUTABLE_MANIFEST_URL: ${{ steps.metadata.outputs.immutable_manifest_url }}
          IMMUTABLE_SIGNATURE_URL: ${{ steps.metadata.outputs.immutable_signature_url }}
        run: |
          set -euo pipefail

          note_file="development/release-notes/${RELEASE_TAG}.md"
          body_file="${RUNNER_TEMP}/release-${RELEASE_TAG}.md"
          monthly_pattern='^[0-9]{4}\.(0[1-9]|1[0-2])$'
          release_tag_pattern='^[0-9]{4}\.(0[1-9]|1[0-2])(\.(0[1-9]|[12][0-9]|3[01])(\.([2-9]|[1-9][0-9]+))?)?$'

          previous_release_tag="$(
            git tag --merged "${RELEASE_SHA}" --sort=-creatordate \
              | grep -E "${release_tag_pattern}" \
              | grep -Fxv "${RELEASE_TAG}" \
              | head -n 1 || true
          )"
          previous_monthly_tag="$(
            git tag --merged "${RELEASE_SHA}" --sort=-creatordate \
              | grep -E "${monthly_pattern}" \
              | grep -Fxv "${RELEASE_TAG}" \
              | head -n 1 || true
          )"

          collect_release_changes() {
            local range_start="$1"
            local -a log_args=()

            if [[ -n "${range_start}" ]]; then
              log_args=("${range_start}..${RELEASE_SHA}")
            else
              log_args=("-n" "15" "${RELEASE_SHA}")
            fi

            git log --no-merges --format='- %s (%h)' "${log_args[@]}"
          }

          if [[ -f "${note_file}" ]]; then
            cat "${note_file}" > "${body_file}"
            {
              echo
              echo '## Complete Commit List'
              echo
            } >> "${body_file}"

            if ! collect_release_changes "${previous_release_tag}" >> "${body_file}"; then
              echo '- Release change summary could not be generated automatically.' >> "${body_file}"
            fi
          else
            compare_base="${previous_release_tag}"
            compare_label='Changes'

            if [[ "${RELEASE_TAG}" =~ ${monthly_pattern} ]]; then
              compare_base="${previous_monthly_tag}"
              compare_label='Changes Since Last Monthly Release'
            fi

            if [[ "${RELEASE_TAG}" =~ ${monthly_pattern} ]]; then
              lead_line='- Monthly release.'
            else
              lead_line='- Manual dated release.'
            fi

            {
              echo '# Highlights'
              echo
              echo "${lead_line}"
              if [[ -n "${compare_base}" ]]; then
                echo "- Changes since \`${compare_base}\`."
              else
                if [[ "${RELEASE_TAG}" =~ ${monthly_pattern} ]]; then
                  echo '- No earlier monthly Veldmuis release tag was found for comparison.'
                else
                  echo '- No earlier Veldmuis release tag was found for comparison.'
                fi
              fi
              echo
              echo "## ${compare_label}"
              echo
            } > "${body_file}"

            if ! collect_release_changes "${compare_base}" >> "${body_file}"; then
              echo '- Release change summary could not be generated automatically.' >> "${body_file}"
            fi
          fi

          {
            echo
            echo "## Release Metadata"
            echo
            echo "- Immutable ISO: ${IMMUTABLE_ISO_URL}"
            echo "- Signed manifest: ${IMMUTABLE_MANIFEST_URL}"
            echo "- Detached signature: ${IMMUTABLE_SIGNATURE_URL}"
            echo "- SHA256: \`${{ steps.metadata.outputs.sha256 }}\`"
            echo
            echo "## Build Metadata"
            echo
            echo "- ISO file: \`${{ steps.metadata.outputs.iso_name }}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Package repo: ${PACKAGE_BASE_URL}"
            echo "- Package inventory: \`$(basename "${PACKAGE_INVENTORY_ASSET_PATH}")\`"
            echo "- SPDX SBOM: \`$(basename "${SBOM_ASSET_PATH}")\`"
            echo "- Build inputs: \`$(basename "${BUILD_INPUTS_ASSET_PATH}")\`"
            echo "- AUR inputs: \`$(basename "${AUR_MANIFEST_ASSET_PATH}")\`"
          } >> "${body_file}"

          if [[ "${RELEASE_TAG}" =~ ${monthly_pattern} ]]; then
            release_title="Veldmuis Linux ${RELEASE_TAG}"
          else
            release_title="Veldmuis ${RELEASE_TAG}"
          fi

          gh release create "${RELEASE_TAG}" \
            --title "${release_title}" \
            --notes-file "${body_file}" \
            --verify-tag

          gh release upload "${RELEASE_TAG}" \
            "${SHA_ASSET_PATH}" \
            "${MANIFEST_ASSET_PATH}" \
            "${SIGNATURE_ASSET_PATH}" \
            "${PACKAGE_INVENTORY_ASSET_PATH}" \
            "${SBOM_ASSET_PATH}" \
            "${BUILD_INPUTS_ASSET_PATH}" \
            "${AUR_MANIFEST_ASSET_PATH}"

          echo "html_url=https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Verify published release policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          public_base="$(printf '%s' "${CF_R2_PUBLIC_BASE_URL:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          [[ "${public_base}" =~ ^https:// ]] || {
            echo "CF_R2_PUBLIC_BASE_URL must be an HTTPS URL" >&2
            exit 1
          }

          VELDMUIS_NETWORK_CHANNEL_URL="${public_base%/}/channels/network.json" \
          VELDMUIS_NETWORK_MANIFEST_URL="${public_base%/}/channels/network.manifest.txt" \
          VELDMUIS_NETWORK_MANIFEST_SIGNATURE_URL="${public_base%/}/channels/network.manifest.txt.sig" \
          VELDMUIS_RELEASE_KEYRING="./packages/veldmuis-keyring/veldmuis.gpg" \
          VELDMUIS_REQUIRED_SIGNED_RELEASE_TAG="${RELEASE_TAG}" \
          ./development/check-release-policy.sh --remote

      - name: Write release summary
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "## Release"
            echo
            echo "- Tag: \`${RELEASE_TAG}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- ISO: \`${{ steps.metadata.outputs.iso_name }}\`"
            echo "- SHA256: \`${{ steps.metadata.outputs.sha256 }}\`"
            echo "- Bucket: \`${CF_R2_BUCKET}\`"
            echo "- Immutable object prefix: \`${{ steps.metadata.outputs.release_object_prefix }}/\`"
            echo "- Network channel key: \`${{ steps.metadata.outputs.channel_object_key }}\`"
            echo "- GitHub Release: ${{ steps.github_release.outputs.html_url }}"
            echo "- Package repo: ${PACKAGE_BASE_URL}"

            public_base="$(printf '%s' "${CF_R2_PUBLIC_BASE_URL:-}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            if [[ "${public_base}" =~ ^https?:// ]]; then
              public_base="${public_base%/}"
              echo "- Network channel: ${public_base}/channels/network.json"
              echo "- Public signed manifest: ${public_base}/channels/network.manifest.txt"
              echo "- Public manifest signature: ${public_base}/channels/network.manifest.txt.sig"
              echo "- Immutable ISO URL: ${{ steps.metadata.outputs.immutable_iso_url }}"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
