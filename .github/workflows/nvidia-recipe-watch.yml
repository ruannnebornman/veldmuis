name: NVIDIA Recipe Watch

on:
  schedule:
    # 11:23 Africa/Johannesburg. GitHub cron uses UTC.
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: veldmuis-nvidia-recipe-watch
  cancel-in-progress: false

jobs:
  watch:
    name: Check upstream NVIDIA recipe drift
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/heads/main

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-repo-hygiene.sh

      - name: Detect upstream recipe drift
        id: drift
        shell: bash
        env:
          VELDMUIS_RECIPE_DRIFT_REPORT: ${{ runner.temp }}/veldmuis-nvidia-recipe-drift.md
        run: |
          set -euo pipefail
          ./development/check-nvidia-recipe-drift.sh --report "${VELDMUIS_RECIPE_DRIFT_REPORT}"

      - name: Open recipe sync pull request
        if: steps.drift.outputs.drift == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.VELDMUIS_SYNC_TOKEN }}
          VELDMUIS_RECIPE_DRIFT_REPORT: ${{ runner.temp }}/veldmuis-nvidia-recipe-drift.md
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "The VELDMUIS_SYNC_TOKEN secret is not set; cannot open the recipe sync pull request." >&2
            echo "Create a fine-grained PAT with Contents and Pull requests read/write access and store it as the VELDMUIS_SYNC_TOKEN repository secret." >&2
            exit 1
          fi

          branch="chore/nvidia-recipe-sync"
          title="NVIDIA 580xx recipe sync"
          body="${RUNNER_TEMP}/veldmuis-nvidia-recipe-sync-pr.md"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          gh auth setup-git

          git fetch --no-tags origin main
          main_ref="$(git rev-parse FETCH_HEAD)"
          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            git fetch --no-tags origin "${branch}"
            git checkout -B "${branch}" FETCH_HEAD
            if ! git merge --no-edit --no-ff "${main_ref}"; then
              git merge --abort || true
              echo "The ${branch} branch conflicts with main; resolve it by hand." >&2
              exit 1
            fi
          else
            git checkout -B "${branch}" "${main_ref}"
          fi

          ./development/sync-nvidia-recipes.sh

          git add -A packages/nvidia-580xx-src
          if git diff --cached --quiet; then
            echo "Vendored recipes already match upstream on ${branch}."
          else
            git commit -m "chore(nvidia): sync vendored 580xx recipes"
            git push origin "HEAD:refs/heads/${branch}"
          fi

          if gh pr list --head "${branch}" --state open --json number --jq 'length' | grep -Eq '^[1-9]'; then
            echo "A pull request for ${branch} is already open; leaving it in place."
            exit 0
          fi

          {
            printf 'The scheduled NVIDIA Recipe Watch workflow found upstream recipe drift and mirrored the vendored recipes under `packages/nvidia-580xx-src` from the upstream AUR package repositories.\n\n'
            printf 'Review the recipe diff, then merge to let the package refresh rebuild.\n\n'
            cat "${VELDMUIS_RECIPE_DRIFT_REPORT}"
          } > "${body}"

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "${title}" \
            --body-file "${body}"
