name: AUR Update Review

on:
  schedule:
    # 12:07 Africa/Johannesburg. GitHub cron uses UTC.
    - cron: "7 10 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: veldmuis-aur-update-review
  cancel-in-progress: false

jobs:
  review:
    name: Review AUR Updates
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      BUILDER_USER: builder
      BUILDER_HOME: /home/builder
      GNUPGHOME: /home/builder/.gnupg
      VELDMUIS_AUR_ENABLE_FALLBACK: false
      VELDMUIS_AUR_UPDATE_GROUP: nvidia-580xx
      VELDMUIS_AUR_UPDATE_BRANCH: automation/aur-update/nvidia-580xx
    steps:
      - name: Check out main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: refs/heads/main

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-repo-hygiene.sh

      - name: Resolve AUR latest refs
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          resolved_refs="${RUNNER_TEMP}/veldmuis-aur-resolved-refs.txt"
          base_sha="$(git rev-parse HEAD)"
          VELDMUIS_AUR_REF_MODE=latest \
            ./development/build-aur-packages.sh --resolve-only \
            | sort > "${resolved_refs}"
          printf 'base_sha=%s\n' "${base_sha}" >> "${GITHUB_OUTPUT}"
          printf 'resolved_refs=%s\n' "${resolved_refs}" >> "${GITHUB_OUTPUT}"

      - name: Audit AUR changes
        id: audit
        shell: bash
        env:
          VELDMUIS_AUR_RESOLVED_REFS_FILE: ${{ steps.resolve.outputs.resolved_refs }}
          VELDMUIS_AUR_UPDATE_REPORT: ${{ runner.temp }}/veldmuis-aur-update-report.md
        run: |
          set -euo pipefail
          ./development/audit-aur-update.sh \
            --resolved-refs "${VELDMUIS_AUR_RESOLVED_REFS_FILE}" \
            --report "${VELDMUIS_AUR_UPDATE_REPORT}"

      - name: Stop when AUR inputs are current
        if: steps.audit.outputs.updates_available != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat "${VELDMUIS_AUR_UPDATE_REPORT}"

      - name: Defer routine low-risk updates to package refresh
        if: steps.audit.outputs.updates_available == 'true' && steps.audit.outputs.risk != 'high'
        shell: bash
        run: |
          set -euo pipefail
          cat "${VELDMUIS_AUR_UPDATE_REPORT}"
          {
            echo "Routine low-risk AUR update detected."
            echo "No candidate build or pull request is created here."
            echo "The scheduled package refresh publishes these refs and opens a quiet lock sync."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare candidate lock
        if: steps.audit.outputs.updates_available == 'true' && steps.audit.outputs.risk == 'high'
        id: candidate_lock
        shell: bash
        env:
          VELDMUIS_AUR_RESOLVED_REFS_FILE: ${{ steps.resolve.outputs.resolved_refs }}
        run: |
          set -euo pipefail
          candidate_lock="${RUNNER_TEMP}/veldmuis-aur-candidate.lock"
          cp development/aur-packages.lock "${candidate_lock}"
          VELDMUIS_AUR_LOCK_FILE="${candidate_lock}" \
            ./development/update-aur-lock.sh \
            --resolved-refs "${VELDMUIS_AUR_RESOLVED_REFS_FILE}" \
            --lock-file "${candidate_lock}"
          printf 'candidate_lock=%s\n' "${candidate_lock}" >> "${GITHUB_OUTPUT}"

      - name: Pin candidate build to audited refs
        if: steps.audit.outputs.updates_available == 'true' && steps.audit.outputs.risk == 'high'
        shell: bash
        env:
          VELDMUIS_AUR_RESOLVED_REFS_FILE: ${{ steps.resolve.outputs.resolved_refs }}
        run: |
          set -euo pipefail
          while read -r package_base ref; do
            suffix="$(printf '%s' "${package_base}" | tr '[:lower:]-' '[:upper:]_')"
            printf 'VELDMUIS_AUR_REF_%s=%s\n' "${suffix}" "${ref}" >> "${GITHUB_ENV}"
          done < "${VELDMUIS_AUR_RESOLVED_REFS_FILE}"
          printf 'VELDMUIS_AUR_REF_MODE=locked\n' >> "${GITHUB_ENV}"

      - name: Build candidate packages without signing credentials
        if: steps.audit.outputs.updates_available == 'true' && steps.audit.outputs.risk == 'high'
        shell: bash
        run: |
          set -euo pipefail
          ./development/run-ci-arch-builder.sh candidate

      - name: Validate candidate package set
        if: steps.audit.outputs.updates_available == 'true' && steps.audit.outputs.risk == 'high'
        shell: bash
        run: |
          set -euo pipefail
          ./development/build-aur-packages.sh --validate-only

      - name: Scan candidate package payload
        if: steps.audit.outputs.updates_available == 'true' && steps.audit.outputs.risk == 'high'
        id: scan
        shell: bash
        env:
          VELDMUIS_AUR_SCAN_REPORT: ${{ runner.temp }}/veldmuis-aur-package-scan.md
        run: |
          set -euo pipefail
          ./development/scan-aur-candidate.sh \
            --report "${VELDMUIS_AUR_SCAN_REPORT}" \
            --source-root artifacts/aur-packages/work

      - name: Combine candidate evidence
        if: steps.audit.outputs.updates_available == 'true' && steps.audit.outputs.risk == 'high'
        id: evidence
        shell: bash
        env:
          AUDIT_REPORT: ${{ steps.audit.outputs.report_file }}
          SCAN_REPORT: ${{ steps.scan.outputs.report_file }}
          REVIEW_BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
        run: |
          set -euo pipefail
          evidence_report="${RUNNER_TEMP}/veldmuis-aur-candidate-evidence.md"
          {
            printf '# Review base commit\n\n%s\n' "${REVIEW_BASE_SHA}"
            printf '\n---\n\n'
            cat "${SCAN_REPORT}"
            printf '\n---\n\n'
            cat "${AUDIT_REPORT}"
          } > "${evidence_report}"
          risk=low
          [[ "${{ steps.audit.outputs.risk }}" == high || "${{ steps.scan.outputs.risk }}" == high ]] && risk=high
          printf '\nfinal_risk=%s\n' "${risk}" >> "${GITHUB_OUTPUT}"
          printf 'evidence_report=%s\n' "${evidence_report}" >> "${GITHUB_OUTPUT}"

      - name: Preserve candidate evidence
        if: steps.audit.outputs.updates_available == 'true' && steps.audit.outputs.risk == 'high'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aur-update-${{ github.run_id }}
          path: |
            ${{ steps.evidence.outputs.evidence_report }}
            ${{ steps.audit.outputs.report_file }}
            ${{ steps.scan.outputs.report_file }}
          if-no-files-found: error
          retention-days: 30

      - name: Create or update candidate pull request
        if: steps.audit.outputs.updates_available == 'true' && steps.evidence.outputs.final_risk == 'high'
        id: update_pr
        shell: bash
        env:
          VELDMUIS_AUR_CANDIDATE_LOCK: ${{ steps.candidate_lock.outputs.candidate_lock }}
          VELDMUIS_AUR_UPDATE_REPORT: ${{ steps.evidence.outputs.evidence_report }}
          VELDMUIS_AUR_UPDATE_RISK: ${{ steps.evidence.outputs.final_risk }}
          VELDMUIS_AUR_REVIEW_BASE_SHA: ${{ steps.resolve.outputs.base_sha }}
          VELDMUIS_AUR_UPDATE_LABELS: high-risk,needs-maintainer-review
          VELDMUIS_AUR_UPDATE_ASSIGNEES: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          ./development/manage-aur-update-pr.sh

      - name: Remind when high-risk review is waiting
        if: steps.update_pr.outputs.pr_number != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.update_pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          pr_url="$(gh pr view "${PR_NUMBER}" --json url --jq '.url')"
          created_at="$(gh pr view "${PR_NUMBER}" --json createdAt --jq '.createdAt')"
          created_epoch="$(date -u -d "${created_at}" +%s)"
          now_epoch="$(date -u +%s)"
          age_days="$(( (now_epoch - created_epoch) / 86400 ))"
          echo "::warning::High-risk AUR update is waiting for review: ${pr_url} (open ${age_days}d)"
          if (( age_days >= 7 && age_days % 7 == 0 )); then
            gh pr comment "${PR_NUMBER}" --body "Reminder: this high-risk AUR update has been waiting ${age_days} days for maintainer review. The scheduled package refresh keeps publishing the locked refs until this is resolved." >/dev/null
          fi
