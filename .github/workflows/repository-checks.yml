name: Repository Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-repo-hygiene.sh

      - name: Check known-good NVIDIA cache helpers
        shell: bash
        run: |
          set -euo pipefail

          for script in \
            development/check-package-repo-refresh.sh \
            development/check-known-good-nvidia-cache.sh \
            development/publish-known-good-nvidia-packages.sh \
            development/restore-known-good-nvidia-packages.sh
          do
            bash -n "${script}"
          done

          ./development/check-known-good-nvidia-cache.sh

      - name: Check installer publication plans
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-release-publisher.sh

      - name: Check Calamares package source checksums
        shell: bash
        run: |
          set -euo pipefail

          package_root="packages/veldmuis-calamares-config"
          expected_bootstrap="$(
            awk '/^sha256sums=/{inside=1; next} inside && /^\)/{exit} inside {gsub(/["[:space:]]/, ""); if (++entry == 2) print}' \
              "${package_root}/PKGBUILD"
          )"
          expected_sets="$(
            awk '/^sha256sums=/{inside=1; next} inside && /^\)/{exit} inside {gsub(/["[:space:]]/, ""); if (++entry == 3) print}' \
              "${package_root}/PKGBUILD"
          )"
          actual_bootstrap="$(sha256sum "${package_root}/veldmuis-calamares-bootstrap.sh" | awk '{ print $1 }')"
          actual_sets="$(sha256sum "${package_root}/installer-package-sets.sh" | awk '{ print $1 }')"

          [[ "${actual_bootstrap}" == "${expected_bootstrap}" ]] || {
            echo "Calamares bootstrap checksum does not match PKGBUILD" >&2
            exit 1
          }
          [[ "${actual_sets}" == "${expected_sets}" ]] || {
            echo "Installer package-set checksum does not match PKGBUILD" >&2
            exit 1
          }

      - name: Check vendored NVIDIA recipes
        shell: bash
        run: |
          set -euo pipefail

          for script in \
            development/build-aur-packages.sh \
            development/install-aur-build-dependency.sh \
            development/scan-aur-candidate.sh
          do
            bash -n "${script}"
          done

          # shellcheck source=packages/veldmuis-nvidia-legacy/nvidia-580xx-package-set.sh
          source packages/veldmuis-nvidia-legacy/nvidia-580xx-package-set.sh
          ((${#veldmuis_nvidia_580xx_aur_package_bases[@]} > 0)) || {
            echo "No vendored NVIDIA package bases defined" >&2
            exit 1
          }

          for base in "${veldmuis_nvidia_580xx_aur_package_bases[@]}"; do
            recipe_dir="packages/nvidia-580xx-src/${base}"
            [[ -d "${recipe_dir}" ]] || {
              echo "Missing vendored recipe directory: ${recipe_dir}" >&2
              exit 1
            }
            [[ -f "${recipe_dir}/PKGBUILD" ]] || {
              echo "Missing vendored PKGBUILD: ${recipe_dir}/PKGBUILD" >&2
              exit 1
            }
            bash -n "${recipe_dir}/PKGBUILD"
          done

          [[ -f packages/nvidia-580xx-src/upstream-refs.txt ]] || {
            echo "Missing packages/nvidia-580xx-src/upstream-refs.txt" >&2
            exit 1
          }

          ./development/build-aur-packages.sh --resolve-only >/dev/null
