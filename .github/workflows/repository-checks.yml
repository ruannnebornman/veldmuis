name: Repository Checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or commit to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Repository
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Check repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-repo-hygiene.sh

      - name: Check managed user defaults updater
        shell: bash
        run: |
          set -euo pipefail
          packages/veldmuis-desktop-kde/test-veldmuis-user-defaults-update.sh

      - name: Check managed user defaults package payload
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-managed-user-defaults-package.sh

      - name: Check installer publication plans
        shell: bash
        run: |
          set -euo pipefail
          ./development/check-release-publisher.sh

      - name: Check installer package-set seed
        shell: bash
        run: |
          set -euo pipefail
          source ./packages/veldmuis-calamares-config/installer-package-sets.sh

          ((${#veldmuis_offline_seed_packages[@]} > 0)) || {
            echo "Offline installer package seed is empty" >&2
            exit 1
          }

          declare -A seen=()
          for package_name in "${veldmuis_offline_seed_packages[@]}"; do
            [[ -n "${package_name}" ]] || {
              echo "Offline installer package seed contains an empty entry" >&2
              exit 1
            }
            [[ -z "${seen[${package_name}]:-}" ]] || {
              echo "Duplicate offline installer seed package: ${package_name}" >&2
              exit 1
            }
            seen["${package_name}"]=1
          done

          echo "Validated ${#seen[@]} offline installer seed packages"

      - name: Check offline manifest package counter
        shell: bash
        run: |
          set -euo pipefail

          counter="development/count-offline-manifest-packages.awk"
          empty_count="$(printf 'header\n' | awk -f "${counter}")"
          populated_count="$(printf 'header\none\ntwo\n' | awk -f "${counter}")"

          [[ "${empty_count}" == "0" ]] || {
            echo "Empty offline manifest count is invalid: ${empty_count}" >&2
            exit 1
          }
          [[ "${populated_count}" == "2" ]] || {
            echo "Populated offline manifest count is invalid: ${populated_count}" >&2
            exit 1
          }

      - name: Check Calamares package source checksums
        shell: bash
        run: |
          set -euo pipefail

          package_root="packages/veldmuis-calamares-config"
          expected_bootstrap="$(
            awk '/^sha256sums=/{inside=1; next} inside && /^\)/{exit} inside {gsub(/["[:space:]]/, ""); if (++entry == 2) print}' \
              "${package_root}/PKGBUILD"
          )"
          expected_sets="$(
            awk '/^sha256sums=/{inside=1; next} inside && /^\)/{exit} inside {gsub(/["[:space:]]/, ""); if (++entry == 3) print}' \
              "${package_root}/PKGBUILD"
          )"
          actual_bootstrap="$(sha256sum "${package_root}/veldmuis-calamares-bootstrap.sh" | awk '{ print $1 }')"
          actual_sets="$(sha256sum "${package_root}/installer-package-sets.sh" | awk '{ print $1 }')"

          [[ "${actual_bootstrap}" == "${expected_bootstrap}" ]] || {
            echo "Calamares bootstrap checksum does not match PKGBUILD" >&2
            exit 1
          }
          [[ "${actual_sets}" == "${expected_sets}" ]] || {
            echo "Installer package-set checksum does not match PKGBUILD" >&2
            exit 1
          }

      - name: Check AUR review helpers
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail

          for script in \
            development/audit-aur-update.sh \
            development/manage-aur-update-pr.sh \
            development/scan-aur-candidate.sh \
            development/update-aur-lock.sh
          do
            bash -n "${script}"
          done

          test_root="$(mktemp -d)"
          trap 'rm -rf -- "${test_root}"' EXIT

          if [[ -n "${PR_BASE_SHA:-}" ]]; then
            base_sha="${PR_BASE_SHA}"
          else
            git fetch --force origin main:refs/remotes/origin/main
            base_sha="$(git rev-parse refs/remotes/origin/main)"
          fi
          git cat-file -e "${base_sha}^{commit}"

          base_lock="${test_root}/base-aur-packages.lock"
          git show "${base_sha}:development/aur-packages.lock" > "${base_lock}"

          if ! git diff --quiet "${base_sha}" HEAD -- development/aur-packages.lock; then
            if [[ "${GITHUB_EVENT_NAME}" == pull_request && ( \
              "${PR_HEAD_REF}" != automation/aur-update/nvidia-580xx || \
              "${PR_HEAD_REPOSITORY}" != "${GITHUB_REPOSITORY}" ) ]]; then
              echo "AUR lock changes must come from the automated update branch" >&2
              exit 1
            fi

            changed_files="$(git diff --name-only "${base_sha}" HEAD)"
            while IFS= read -r changed_file; do
              [[ "${changed_file}" == development/aur-packages.lock ]] || {
                echo "AUR update branch changed an unexpected file: ${changed_file}" >&2
                exit 1
              }
            done <<< "${changed_files}"
          fi

          cp development/aur-packages.lock "${test_root}/aur-packages.lock"
          awk 'NF && $1 !~ /^#/ { print $1 " " $2 }' \
            development/aur-packages.lock > "${test_root}/resolved-refs.txt"
          ./development/update-aur-lock.sh \
            --resolved-refs "${test_root}/resolved-refs.txt" \
            --lock-file "${test_root}/aur-packages.lock"
          cmp -s development/aur-packages.lock "${test_root}/aur-packages.lock"

          VELDMUIS_AUR_LOCK_FILE="${base_lock}" \
            ./development/audit-aur-update.sh \
            --resolved-refs development/aur-packages.lock \
            --report "${test_root}/aur-update-report.md"
          grep -q '^Overall risk: \(low\|high\)$' "${test_root}/aur-update-report.md"
